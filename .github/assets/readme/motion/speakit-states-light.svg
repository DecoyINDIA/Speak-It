    <text x="18" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#616460">Centered 12px above active taskbar; ignores mouse clicks until hovered.</text>
