    <text x="18" y="25" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#397500" letter-spacing="0.05em">01 · IDLE / STANDBY</text>
    <text x="406" y="25" text-anchor="end" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="10" fill="#616460">state: IDLE</text>
