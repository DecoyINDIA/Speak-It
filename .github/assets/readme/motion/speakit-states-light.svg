<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="100%" height="100%">
  <style>
    .eq { transform-box: fill-box; transform-origin: center; animation-name: eq-scale; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    @keyframes eq-scale { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1.12); } }
    .live-dot { transform-box: fill-box; transform-origin: center; animation: pulse-live 1.7s ease-in-out infinite; }
    @keyframes pulse-live { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.78; } }
    .spinner { transform-box: fill-box; transform-origin: center; animation: spin-cw 0.85s linear infinite; }
    @keyframes spin-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

  <rect x="0.5" y="0.5" width="959" height="447" rx="16" fill="#ecedeb" stroke="#dddfdc" />

  <text x="44" y="42" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="11" font-weight="600" fill="#397500" letter-spacing="0.06em">FLOATING BAR INTERFACE  ·  BAR.TSX</text>
  <text x="44" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#151714" letter-spacing="-0.025em">Seven Deterministic States, Always Readable Over Any App</text>

  
  <g transform="translate(44, 92)">
