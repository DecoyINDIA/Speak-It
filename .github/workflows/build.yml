name: SpeakIt CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Step 1 - TypeScript Typecheck
        run: npm run typecheck

      - name: Step 2 - Vitest Unit & Quality Suite
        run: npm test

      - name: Step 3 - Compile SpeakIt Native Helper (net48)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File native/helper/build.ps1

      - name: Step 4 - Helper Contract Tests
        run: npx vitest run test/unit/helperClient.test.ts

      - name: Step 5 - Electron-Vite Production Build
        run: npm run build

      - name: Step 6 - Electron-Builder NSIS Package
        run: npm run pack
