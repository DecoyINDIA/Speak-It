<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="520" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="hero-glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#0B2B1B" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#080A09" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060706" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#2D3831" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#18201B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F58C" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="text-volt-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2FDF6"/>
      <stop offset="100%" stop-color="#00F58C"/>
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B221E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F1411" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00F58C" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F58C" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#00F58C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F58C" stop-opacity="0"/>
    </linearGradient>

    <filter id="volt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161F19" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; }
      .font-mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

      /* Animations */
      .ambient-pulse {
        animation: ambientBreath 6s ease-in-out infinite;
      }
      .wave-1 {
        animation: waveFlow1 5s ease-in-out infinite alternate;
      }
      .wave-2 {
        animation: waveFlow2 7s ease-in-out infinite alternate;
      }
      .live-dot {
        animation: liveBlink 1.4s ease-in-out infinite;
      }
      .eq-bar-1 { animation: eqPulse1 0.8s ease-in-out infinite alternate; }
      .eq-bar-2 { animation: eqPulse2 0.9s ease-in-out infinite alternate; }
      .eq-bar-3 { animation: eqPulse3 1.1s ease-in-out infinite alternate; }
      .eq-bar-4 { animation: eqPulse4 0.7s ease-in-out infinite alternate; }
      .eq-bar-5 { animation: eqPulse5 1.2s ease-in-out infinite alternate; }
      .eq-bar-6 { animation: eqPulse6 0.85s ease-in-out infinite alternate; }
      .eq-bar-7 { animation: eqPulse7 1.0s ease-in-out infinite alternate; }
      .eq-bar-8 { animation: eqPulse8 0.75s ease-in-out infinite alternate; }
      .eq-bar-9 { animation: eqPulse9 0.95s ease-in-out infinite alternate; }
      .shimmer-text {
        animation: shimmerSweep 6s ease-in-out infinite;
      }
      .key-press {
        animation: keyGlow 3s ease-in-out infinite;
      }

      @keyframes ambientBreath {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes waveFlow1 {
        0% { transform: translateY(0px) scaleY(1); }
        100% { transform: translateY(-8px) scaleY(1.3); }
      }
      @keyframes waveFlow2 {
        0% { transform: translateY(0px) scaleY(0.9); }
        100% { transform: translateY(6px) scaleY(1.25); }
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00F58C); }
        50% { opacity: 0.3; filter: drop-shadow(0 0 1px #00F58C); }
      }
      @keyframes keyGlow {
        0%, 100% { stroke: #2D3A32; filter: none; }
        50% { stroke: #00F58C; filter: drop-shadow(0 0 5px rgba(0,245,140,0.5)); }
      }
      @keyframes eqPulse1 { 0% { height: 6px; y: 15px; } 100% { height: 22px; y: 7px; } }
      @keyframes eqPulse2 { 0% { height: 10px; y: 13px; } 100% { height: 26px; y: 5px; } }
      @keyframes eqPulse3 { 0% { height: 14px; y: 11px; } 100% { height: 30px; y: 3px; } }
      @keyframes eqPulse4 { 0% { height: 8px; y: 14px; } 100% { height: 20px; y: 8px; } }
      @keyframes eqPulse5 { 0% { height: 16px; y: 10px; } 100% { height: 32px; y: 2px; } }
      @keyframes eqPulse6 { 0% { height: 12px; y: 12px; } 100% { height: 28px; y: 4px; } }
      @keyframes eqPulse7 { 0% { height: 9px; y: 13.5px; } 100% { height: 24px; y: 6px; } }
      @keyframes eqPulse8 { 0% { height: 15px; y: 10.5px; } 100% { height: 27px; y: 4.5px; } }
      @keyframes eqPulse9 { 0% { height: 7px; y: 14.5px; } 100% { height: 18px; y: 9px; } }

      @media (prefers-reduced-motion: reduce) {
        .ambient-pulse, .wave-1, .wave-2, .live-dot, .key-press,
        .eq-bar-1, .eq-bar-2, .eq-bar-3, .eq-bar-4, .eq-bar-5, .eq-bar-6, .eq-bar-7, .eq-bar-8, .eq-bar-9 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="520" rx="16" fill="#080A09"/>
  <rect width="1200" height="520" rx="16" fill="url(#hero-glow)"/>
  <rect width="1200" height="520" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="15.5" stroke="url(#card-border)" stroke-width="1"/>

  <!-- Top Metadata Navigation Bar -->
  <g transform="translate(40, 36)">
    <circle cx="6" cy="6" r="4" fill="#00F58C" class="live-dot"/>
    <text x="20" y="10" fill="#00F58C" font-size="11" font-weight="700" letter-spacing="2.5" class="font-mono">SPEAKIT ENGINE // v2.0</text>
    
    <g transform="translate(620, -4)">
      <rect x="0" y="0" width="490" height="24" rx="12" fill="#111613" stroke="#1F2822" stroke-width="1"/>
      <text x="245" y="16" text-anchor="middle" fill="#9CA3AF" font-size="10.5" font-weight="600" letter-spacing="1.2" class="font-mono">
        <tspan fill="#00F58C">●</tspan> ZERO TELEMETRY  •  <tspan fill="#38BDF8">◆</tspan> 100% OFFLINE READY  •  <tspan fill="#F59E0B">★</tspan> MIT OPEN SOURCE
      </text>
    </g>
  </g>

  <!-- Animated Soundwave Canvas in Center -->
  <g transform="translate(200, 220)">
    <!-- Ambient Wave Glow -->
    <path class="wave-2" d="M -150 20 Q 50 -60 200 10 T 550 -10 T 850 30" fill="none" stroke="url(#wave-grad-2)" stroke-width="4" opacity="0.5" filter="url(#volt-glow)"/>
    <path class="wave-1" d="M -150 -10 Q 70 70 240 -20 T 600 25 T 850 -20" fill="none" stroke="url(#wave-grad-1)" stroke-width="3" opacity="0.8" filter="url(#volt-glow)"/>
  </g>

  <!-- Main Hero Brand Typography -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Super-title -->
    <text y="-32" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="4" class="font-mono">
      SYSTEM-WIDE INTELLIGENT VOICE RUNTIME
    </text>

    <!-- Main Title -->
    <text y="38" fill="url(#text-volt-grad)" font-size="78" font-weight="900" letter-spacing="-2" class="font-sans" filter="url(#volt-glow)">
      SpeakIt
    </text>

    <!-- Subtitle -->
    <text y="82" fill="#E5E7EB" font-size="20" font-weight="400" letter-spacing="-0.2" class="font-sans">
      Voice Typing for Windows that <tspan fill="#00F58C" font-weight="700">Sounds Like You</tspan>.
    </text>
    <text y="108" fill="#9CA3AF" font-size="14" font-weight="400" class="font-sans">
      Understands Hinglish • AI Disfluency &amp; Self-Correction • Sub-Second Latency • Zero Cloud Dependency
    </text>
  </g>

  <!-- Animated Floating Live Bar (Simulating Desktop Pill) -->
  <g transform="translate(410, 310)">
    <!-- Outer Pill Box -->
    <rect width="380" height="54" rx="27" fill="url(#pill-bg)" stroke="#00F58C" stroke-width="1.5" filter="url(#volt-glow)"/>

    <!-- Left Live Recording Dot -->
    <circle cx="28" cy="27" r="5" fill="#00F58C" class="live-dot"/>
    <text x="44" y="32" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="0.5" class="font-sans">Listening</text>

    <!-- 9-Band Real-Time Audio Equalizer -->
    <g transform="translate(132, 9)" fill="#00F58C">
      <rect x="0" y="15" width="3.5" height="6" rx="1.75" class="eq-bar-1"/>
      <rect x="8" y="13" width="3.5" height="10" rx="1.75" class="eq-bar-2"/>
      <rect x="16" y="11" width="3.5" height="14" rx="1.75" class="eq-bar-3"/>
      <rect x="24" y="14" width="3.5" height="8" rx="1.75" class="eq-bar-4"/>
      <rect x="32" y="10" width="3.5" height="16" rx="1.75" class="eq-bar-5"/>
      <rect x="40" y="12" width="3.5" height="12" rx="1.75" class="eq-bar-6"/>
      <rect x="48" y="13.5" width="3.5" height="9" rx="1.75" class="eq-bar-7"/>
      <rect x="56" y="10.5" width="3.5" height="15" rx="1.75" class="eq-bar-8"/>
      <rect x="64" y="14.5" width="3.5" height="7" rx="1.75" class="eq-bar-9"/>
    </g>

    <!-- Hotkey Indicator Badge in Pill -->
    <g transform="translate(230, 13)">
      <rect width="134" height="28" rx="14" fill="#131B16" stroke="#25352A" stroke-width="1"/>
      <text x="67" y="18" text-anchor="middle" fill="#00F58C" font-size="11" font-weight="700" class="font-mono">
        HOLD Ctrl + ⊞ Win
      </text>
    </g>
  </g>

  <!-- Bottom Interactive Capabilities Dock -->
  <g transform="translate(60, 420)">
    <!-- Pill 1: Latency -->
    <g transform="translate(0, 0)">
      <rect width="250" height="48" rx="10" fill="#0F1411" stroke="#1D2620" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#00F58C" fill-opacity="0.12"/>
      <path d="M 23 18 L 20 25 L 24 25 L 23 30 L 28 23 L 24 23 Z" fill="#00F58C"/>
      <text x="44" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Sub-Second Streaming</text>
      <text x="44" y="37" fill="#6B7280" font-size="11" font-weight="500" class="font-mono">Groq LPU p50 ~480ms</text>
    </g>

    <!-- Pill 2: Hinglish -->
    <g transform="translate(276, 0)">
      <rect width="250" height="48" rx="10" fill="#0F1411" stroke="#1D2620" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#38BDF8" fill-opacity="0.12"/>
      <text x="24" y="28" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="800" class="font-sans">अ/A</text>
      <text x="44" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Hinglish &amp; Accents</text>
      <text x="44" y="37" fill="#6B7280" font-size="11" font-weight="500" class="font-mono">Zero Phonetic Mangle</text>
    </g>

    <!-- Pill 3: Offline -->
    <g transform="translate(552, 0)">
      <rect width="250" height="48" rx="10" fill="#0F1411" stroke="#1D2620" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#00F58C" fill-opacity="0.12"/>
      <path d="M 18 20 C 18 16 30 16 30 20 C 32 20 32 26 28 27 L 18 27 C 14 27 15 20 18 20 Z" fill="none" stroke="#00F58C" stroke-width="1.5"/>
      <line x1="16" y1="16" x2="32" y2="30" stroke="#00F58C" stroke-width="1.5"/>
      <text x="44" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">100% Offline Engine</text>
      <text x="44" y="37" fill="#6B7280" font-size="11" font-weight="500" class="font-mono">whisper.cpp Local Core</text>
    </g>

    <!-- Pill 4: Security Shield -->
    <g transform="translate(828, 0)">
      <rect width="252" height="48" rx="10" fill="#0F1411" stroke="#1D2620" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#F43F5E" fill-opacity="0.12"/>
      <path d="M 24 16 L 31 19 L 31 24 C 31 28 27 31 24 32 C 21 31 17 28 17 24 L 17 19 Z" fill="none" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="44" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Password Field Shield</text>
      <text x="44" y="37" fill="#6B7280" font-size="11" font-weight="500" class="font-mono">UI Automation Block</text>
    </g>
  </g>
</svg>
