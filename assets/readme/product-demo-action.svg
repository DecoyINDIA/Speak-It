<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="560" fill="none">
  <defs>
    <radialGradient id="demo-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0F1713"/>
      <stop offset="60%" stop-color="#080A09"/>
      <stop offset="100%" stop-color="#050706"/>
    </radialGradient>

    <linearGradient id="win-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#243329" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F58C" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="demo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; }
      .font-mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

      /* Choreographed Timeline Loop: 10s total */
      /* Phase 1: 0s - 3.2s Listening */
      /* Phase 2: 3.2s - 5.4s Processing */
      /* Phase 3: 5.4s - 9.2s Inserted and Clean Text Display */
      /* Phase 4: 9.2s - 10s Fade out / loop reset */

      .state-listening {
        animation: animListening 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .state-processing {
        animation: animProcessing 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .state-inserted {
        animation: animInserted 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .audio-waveform-bars {
        animation: animWaveBars 10s ease-in-out infinite;
      }
      .spoken-raw-bubble {
        animation: animRawBubble 10s ease-in-out infinite;
      }
      .typed-clean-text {
        animation: animCleanText 10s ease-in-out infinite;
      }
      .typing-cursor {
        animation: animCursor 10s ease-in-out infinite;
      }
      .spinner-rot {
        transform-origin: 18px 18px;
        animation: spin 1s linear infinite;
      }

      /* Equalizer Bar Heights */
      .bar-a { animation: barH1 0.7s infinite alternate; }
      .bar-b { animation: barH2 0.9s infinite alternate; }
      .bar-c { animation: barH3 1.1s infinite alternate; }
      .bar-d { animation: barH4 0.8s infinite alternate; }

      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes barH1 { 0% { height: 6px; y: 14px; } 100% { height: 22px; y: 6px; } }
      @keyframes barH2 { 0% { height: 12px; y: 11px; } 100% { height: 26px; y: 4px; } }
      @keyframes barH3 { 0% { height: 8px; y: 13px; } 100% { height: 20px; y: 7px; } }
      @keyframes barH4 { 0% { height: 14px; y: 10px; } 100% { height: 28px; y: 3px; } }

      @keyframes animListening {
        0%, 30% { opacity: 1; transform: translateY(0); }
        32%, 100% { opacity: 0; transform: translateY(-5px); pointer-events: none; }
      }
      @keyframes animProcessing {
        0%, 31% { opacity: 0; transform: translateY(5px); }
        33%, 52% { opacity: 1; transform: translateY(0); }
        54%, 100% { opacity: 0; transform: translateY(-5px); }
      }
      @keyframes animInserted {
        0%, 53% { opacity: 0; transform: translateY(5px); }
        55%, 92% { opacity: 1; transform: translateY(0); }
        95%, 100% { opacity: 0; transform: translateY(-5px); }
      }
      @keyframes animRawBubble {
        0%, 5% { opacity: 0; transform: translateY(8px); }
        10%, 30% { opacity: 1; transform: translateY(0); }
        33%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes animCleanText {
        0%, 54% { opacity: 0; clip-path: inset(0 100% 0 0); }
        56% { opacity: 1; clip-path: inset(0 80% 0 0); }
        66% { opacity: 1; clip-path: inset(0 30% 0 0); }
        74%, 92% { opacity: 1; clip-path: inset(0 0% 0 0); }
        96%, 100% { opacity: 0; clip-path: inset(0 0% 0 0); }
      }
      @keyframes animCursor {
        0%, 54% { opacity: 0; }
        55%, 75% { opacity: 1; }
        76%, 92% { opacity: 0.8; }
        95%, 100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .state-listening, .state-processing, .state-inserted,
        .audio-waveform-bars, .spoken-raw-bubble, .typed-clean-text, .typing-cursor {
          animation: none !important;
          opacity: 1 !important;
          clip-path: none !important;
        }
        .state-processing { display: none; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="560" rx="16" fill="#080A09"/>
  <rect width="1000" height="560" rx="16" fill="url(#demo-bg)"/>
  <rect x="0.5" y="0.5" width="999" height="559" rx="15.5" stroke="url(#win-border)" stroke-width="1"/>

  <!-- Desktop Window Mockup (Windows 11 Frame) -->
  <g transform="translate(60, 45)">
    <!-- Window Outer Shell -->
    <rect width="880" height="470" rx="12" fill="#0F1411" stroke="#1F2A22" stroke-width="1"/>
    
    <!-- Window Titlebar -->
    <rect width="880" height="40" rx="12" fill="#141C17"/>
    <path d="M 0 39 L 880 39" stroke="#1F2A22" stroke-width="1"/>
    
    <!-- Window Controls (Win11 right-side) -->
    <g transform="translate(810, 14)">
      <line x1="0" y1="6" x2="10" y2="6" stroke="#6B7280" stroke-width="1.2"/>
      <rect x="22" y="1" width="10" height="10" fill="none" stroke="#6B7280" stroke-width="1.2"/>
      <path d="M 44 1 L 54 11 M 54 1 L 44 11" stroke="#6B7280" stroke-width="1.2"/>
    </g>

    <!-- App Identity & Title -->
    <g transform="translate(20, 13)">
      <circle cx="7" cy="7" r="4" fill="#00F58C"/>
      <text x="20" y="11" fill="#D1D5DB" font-size="12" font-weight="600" class="font-sans">
        Slack // #product-engineering — Direct Message to Sunita
      </text>
    </g>

    <!-- Chat / Text Canvas Area -->
    <g transform="translate(40, 70)">
      <!-- Previous Chat Bubble -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="34" height="34" rx="17" fill="#1E2B22"/>
        <text x="17" y="22" text-anchor="middle" fill="#00F58C" font-size="12" font-weight="700" class="font-sans">SK</text>
        <text x="46" y="14" fill="#9CA3AF" font-size="12" font-weight="600" class="font-sans">Sunita Kapoor <tspan fill="#4B5563" font-size="11">11:42 AM</tspan></text>
        <text x="46" y="32" fill="#E5E7EB" font-size="13" class="font-sans">Hey, what is the status of the sprint deliverables for next week?</text>
      </g>

      <!-- Active User Input Box -->
      <g transform="translate(0, 75)">
        <rect x="0" y="0" width="800" height="150" rx="8" fill="#141C16" stroke="#25352A" stroke-width="1"/>
        <text x="20" y="28" fill="#6B7280" font-size="12" class="font-mono">// Active Input Focus (System-wide Win32 Hook Target)</text>

        <!-- Dynamic Typing Output Stream -->
        <g transform="translate(20, 65)">
          <!-- Dynamic Clean Inserted Text -->
          <text class="typed-clean-text font-sans" x="0" y="0" fill="#FFFFFF" font-size="17" font-weight="500">
            "Sunita, deliverable ready hai; hum Tuesday meeting mein finalize kar lenge."
          </text>
          
          <!-- Animated Typing Cursor -->
          <rect class="typing-cursor" x="650" y="-16" width="2.5" height="20" fill="#00F58C"/>
        </g>

        <!-- Spoken Live Audio Transcript Bubble (During Speech) -->
        <g class="spoken-raw-bubble" transform="translate(20, 102)">
          <rect x="0" y="0" width="620" height="32" rx="6" fill="#18241C" stroke="#2B3E30" stroke-width="1"/>
          <circle cx="16" cy="16" r="4" fill="#00F58C"/>
          <text x="30" y="20" fill="#9CA3AF" font-size="12" class="font-mono">
            Spoken raw: <tspan fill="#F3F4F6">"Arre Sunita deliverable ready hai, hum Tuesday meeting mein..."</tspan>
          </text>
        </g>
      </g>
    </g>

    <!-- FLOATING SPEAKIT BAR (THE CORE PRODUCT ARTIFACT) -->
    <g transform="translate(280, 320)">
      <!-- STATE 1: LISTENING -->
      <g class="state-listening">
        <rect width="320" height="50" rx="25" fill="#141E18" stroke="#00F58C" stroke-width="1.8" filter="url(#demo-glow)"/>
        <circle cx="26" cy="25" r="5" fill="#00F58C"/>
        <text x="42" y="30" fill="#FFFFFF" font-size="13.5" font-weight="700" class="font-sans">Listening…</text>
        
        <!-- Live Audio Wave Equalizer -->
        <g transform="translate(140, 10)" fill="#00F58C">
          <rect x="0" y="14" width="3.5" height="8" rx="1.75" class="bar-a"/>
          <rect x="7" y="11" width="3.5" height="14" rx="1.75" class="bar-b"/>
          <rect x="14" y="8" width="3.5" height="18" rx="1.75" class="bar-c"/>
          <rect x="21" y="12" width="3.5" height="12" rx="1.75" class="bar-d"/>
          <rect x="28" y="7" width="3.5" height="20" rx="1.75" class="bar-b"/>
          <rect x="35" y="13" width="3.5" height="10" rx="1.75" class="bar-a"/>
          <rect x="42" y="9" width="3.5" height="16" rx="1.75" class="bar-c"/>
        </g>

        <!-- Hotkey Cancel action -->
        <g transform="translate(225, 12)">
          <rect width="80" height="26" rx="13" fill="#1C2920" stroke="#2B3F31" stroke-width="1"/>
          <text x="40" y="17" text-anchor="middle" fill="#00F58C" font-size="10.5" font-weight="700" class="font-mono">Ctrl+Win</text>
        </g>
      </g>

      <!-- STATE 2: PROCESSING DICTATION -->
      <g class="state-processing">
        <rect width="320" height="50" rx="25" fill="#141E18" stroke="#38BDF8" stroke-width="1.8" filter="url(#demo-glow)"/>
        
        <!-- Spinner Icon -->
        <g transform="translate(22, 16)">
          <circle cx="9" cy="9" r="8" fill="none" stroke="#23352A" stroke-width="2.5"/>
          <path d="M 9 1 A 8 8 0 0 1 17 9" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" class="spinner-rot"/>
        </g>

        <text x="50" y="30" fill="#FFFFFF" font-size="13" font-weight="600" class="font-sans">Groq LPU Processing…</text>
        <text x="236" y="30" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono">~480ms</text>
      </g>

      <!-- STATE 3: INSERTED -->
      <g class="state-inserted">
        <rect width="320" height="50" rx="25" fill="#141E18" stroke="#00F58C" stroke-width="1.8" filter="url(#demo-glow)"/>
        
        <!-- Checkmark Badge -->
        <circle cx="26" cy="25" r="9" fill="#00F58C"/>
        <path d="M 22 25 L 25 28 L 30 22" fill="none" stroke="#0B130E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="44" y="30" fill="#FFFFFF" font-size="13.5" font-weight="700" class="font-sans">Inserted into Slack</text>
        <text x="215" y="30" fill="#00F58C" font-size="11" font-weight="700" class="font-mono">✓ WIN32 PASTE</text>
      </g>
    </g>

    <!-- Bottom Explanatory Banner -->
    <g transform="translate(40, 420)">
      <rect width="800" height="36" rx="6" fill="#111813" stroke="#1D2A20" stroke-width="1"/>
      <text x="20" y="23" fill="#9CA3AF" font-size="12" class="font-sans">
        <tspan fill="#00F58C" font-weight="700">How it works:</tspan> 
        Hold <tspan fill="#FFFFFF" font-family="'Cascadia Code', monospace">Ctrl+Win</tspan> anywhere → Speak naturally in English, Hindi, or Hinglish → Release → Clean formatted text appears at cursor.
      </text>
    </g>
  </g>
</svg>
