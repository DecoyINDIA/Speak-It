<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="380" fill="none">
  <defs>
    <radialGradient id="pipe-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080A09" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="prog-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F58C"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F58C"/>
    </linearGradient>

    <filter id="pipe-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; }
      .font-mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

      /* Animation cycle: 6s loop */
      .pipeline-runner {
        animation: runPipeline 6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .node-pulse-1 { animation: nodeP 6s infinite 0.2s; }
      .node-pulse-2 { animation: nodeP 6s infinite 0.8s; }
      .node-pulse-3 { animation: nodeP 6s infinite 2.2s; }
      .node-pulse-4 { animation: nodeP 6s infinite 3.5s; }
      .node-pulse-5 { animation: nodeP 6s infinite 4.2s; }

      @keyframes runPipeline {
        0% { transform: translateX(0); opacity: 0; }
        10% { opacity: 1; }
        85% { opacity: 1; }
        95%, 100% { transform: translateX(860px); opacity: 0; }
      }
      @keyframes nodeP {
        0%, 15% { transform: scale(1); filter: none; }
        25% { transform: scale(1.15); filter: drop-shadow(0 0 8px #00F58C); }
        40%, 100% { transform: scale(1); filter: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .pipeline-runner, .node-pulse-1, .node-pulse-2, .node-pulse-3, .node-pulse-4, .node-pulse-5 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect width="1000" height="380" rx="16" fill="#080A09"/>
  <rect width="1000" height="380" rx="16" fill="url(#pipe-glow)"/>
  <rect x="0.5" y="0.5" width="999" height="379" rx="15.5" stroke="#1D2721" stroke-width="1"/>

  <!-- Title Section -->
  <g transform="translate(40, 32)">
    <rect width="210" height="24" rx="12" fill="#111B15" stroke="#1E3326" stroke-width="1"/>
    <text x="105" y="16" text-anchor="middle" fill="#00F58C" font-size="10.5" font-weight="700" letter-spacing="1.5" class="font-mono">
      STREAMING LATENCY BUDGET
    </text>

    <text x="0" y="56" fill="#FFFFFF" font-size="22" font-weight="800" class="font-sans">
      Sub-Second End-to-End Processing Timeline
    </text>
    <text x="0" y="76" fill="#9CA3AF" font-size="13" class="font-sans">
      Deterministic latency breakdown from physical key release to synthetic keyboard buffer injection.
    </text>
  </g>

  <!-- Pipeline Horizontal Track -->
  <g transform="translate(70, 150)">
    <!-- Base track line -->
    <line x1="0" y1="40" x2="860" y2="40" stroke="#1C2720" stroke-width="3"/>
    
    <!-- Animated Light Runner Dot -->
    <g class="pipeline-runner">
      <circle cx="0" cy="40" r="6" fill="#00F58C" filter="url(#pipe-filter)"/>
      <line x1="-30" y1="40" x2="0" y2="40" stroke="url(#prog-bar-grad)" stroke-width="3"/>
    </g>

    <!-- STAGE 1: KEYPRESS -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="40" r="14" fill="#111B15" stroke="#00F58C" stroke-width="2" class="node-pulse-1"/>
      <circle cx="0" cy="40" r="5" fill="#00F58C"/>
      <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">01 // TRIGGER</text>
      <text x="0" y="16" text-anchor="middle" fill="#9CA3AF" font-size="11" class="font-sans">Ctrl+Win Release</text>
      <text x="0" y="74" text-anchor="middle" fill="#00F58C" font-size="14" font-weight="800" class="font-mono">0 ms</text>
      <text x="0" y="90" text-anchor="middle" fill="#6B7280" font-size="10" class="font-mono">Win32 Hook</text>
    </g>

    <!-- STAGE 2: OPUS CAPTURE -->
    <g transform="translate(215, 0)">
      <circle cx="0" cy="40" r="14" fill="#111B15" stroke="#00F58C" stroke-width="2" class="node-pulse-2"/>
      <circle cx="0" cy="40" r="5" fill="#00F58C"/>
      <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">02 // CAPTURE</text>
      <text x="0" y="16" text-anchor="middle" fill="#9CA3AF" font-size="11" class="font-sans">Opus WebM 32kbps</text>
      <text x="0" y="74" text-anchor="middle" fill="#00F58C" font-size="14" font-weight="800" class="font-mono">+40 ms</text>
      <text x="0" y="90" text-anchor="middle" fill="#6B7280" font-size="10" class="font-mono">~40 KB upload</text>
    </g>

    <!-- STAGE 3: GROQ LPU -->
    <g transform="translate(430, 0)">
      <circle cx="0" cy="40" r="14" fill="#111B15" stroke="#38BDF8" stroke-width="2" class="node-pulse-3"/>
      <circle cx="0" cy="40" r="5" fill="#38BDF8"/>
      <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">03 // LPU STT</text>
      <text x="0" y="16" text-anchor="middle" fill="#9CA3AF" font-size="11" class="font-sans">Whisper Large v3</text>
      <text x="0" y="74" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="800" class="font-mono">+480 ms</text>
      <text x="0" y="90" text-anchor="middle" fill="#6B7280" font-size="10" class="font-mono">Groq LPU Array</text>
    </g>

    <!-- STAGE 4: LLM CLEANUP -->
    <g transform="translate(645, 0)">
      <circle cx="0" cy="40" r="14" fill="#111B15" stroke="#38BDF8" stroke-width="2" class="node-pulse-4"/>
      <circle cx="0" cy="40" r="5" fill="#38BDF8"/>
      <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">04 // COGNITIVE</text>
      <text x="0" y="16" text-anchor="middle" fill="#9CA3AF" font-size="11" class="font-sans">Llama 3.3 70B</text>
      <text x="0" y="74" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="800" class="font-mono">+210 ms</text>
      <text x="0" y="90" text-anchor="middle" fill="#6B7280" font-size="10" class="font-mono">Disfluency Strip</text>
    </g>

    <!-- STAGE 5: WIN32 PASTE -->
    <g transform="translate(860, 0)">
      <circle cx="0" cy="40" r="14" fill="#111B15" stroke="#00F58C" stroke-width="2" class="node-pulse-5"/>
      <circle cx="0" cy="40" r="5" fill="#00F58C"/>
      <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">05 // INJECT</text>
      <text x="0" y="16" text-anchor="middle" fill="#9CA3AF" font-size="11" class="font-sans">WM_RENDERFORMAT</text>
      <text x="0" y="74" text-anchor="middle" fill="#00F58C" font-size="14" font-weight="800" class="font-mono">+15 ms</text>
      <text x="0" y="90" text-anchor="middle" fill="#6B7280" font-size="10" class="font-mono">Cursor Inserted</text>
    </g>
  </g>

  <!-- Bottom Metric Comparison Bar -->
  <g transform="translate(40, 290)">
    <rect width="920" height="56" rx="8" fill="#0F1612" stroke="#1E2B22" stroke-width="1"/>
    
    <g transform="translate(24, 18)">
      <text x="0" y="14" fill="#9CA3AF" font-size="11" font-weight="700" class="font-mono">TOTAL P50 LATENCY:</text>
      <text x="160" y="14" fill="#00F58C" font-size="18" font-weight="900" class="font-mono" filter="url(#pipe-filter)">~745 ms</text>

      <path d="M 280 0 L 280 24" stroke="#223126" stroke-width="1"/>

      <!-- Competitor comparisons -->
      <text x="310" y="14" fill="#6B7280" font-size="12" class="font-sans">
        Wispr Flow: <tspan fill="#E5E7EB" font-family="'Cascadia Code', monospace">~900 ms</tspan>
      </text>
      <text x="480" y="14" fill="#6B7280" font-size="12" class="font-sans">
        Windows Win+H: <tspan fill="#E5E7EB" font-family="'Cascadia Code', monospace">~1,200 ms</tspan>
      </text>
      <text x="660" y="14" fill="#00F58C" font-size="12" font-weight="700" class="font-sans">
        ⚡ 38% FASTER THAN WIN+H
      </text>
    </g>
  </g>
</svg>
