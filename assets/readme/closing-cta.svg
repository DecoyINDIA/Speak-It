<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="420" fill="none">
  <defs>
    <radialGradient id="cta-glow" cx="50%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#0F281B" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#080A09" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#060706" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="btn-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F58C"/>
      <stop offset="100%" stop-color="#05C973"/>
    </linearGradient>

    <filter id="cta-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; }
      .font-mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

      .pulse-core {
        animation: breathCore 3s ease-in-out infinite alternate;
      }
      .particle-1 { animation: driftUp 4s ease-in-out infinite; }
      .particle-2 { animation: driftUp 5s ease-in-out infinite 1.2s; }
      .particle-3 { animation: driftUp 3.6s ease-in-out infinite 2.1s; }
      .particle-4 { animation: driftUp 4.8s ease-in-out infinite 0.7s; }
      .btn-shimmer {
        animation: btnGlow 2.5s ease-in-out infinite alternate;
      }

      @keyframes breathCore {
        0% { transform: scale(1); filter: drop-shadow(0 0 4px #00F58C); }
        100% { transform: scale(1.06); filter: drop-shadow(0 0 16px #00F58C); }
      }
      @keyframes driftUp {
        0% { transform: translateY(0); opacity: 0; }
        30% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-70px); opacity: 0; }
      }
      @keyframes btnGlow {
        0% { filter: drop-shadow(0 0 2px rgba(0,245,140,0.4)); }
        100% { filter: drop-shadow(0 0 12px rgba(0,245,140,0.8)); }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse-core, .particle-1, .particle-2, .particle-3, .particle-4, .btn-shimmer {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1000" height="420" rx="16" fill="#080A09"/>
  <rect width="1000" height="420" rx="16" fill="url(#cta-glow)"/>
  <rect x="0.5" y="0.5" width="999" height="419" rx="15.5" stroke="#1F2A22" stroke-width="1"/>

  <!-- Background Horizon Curves & Grid -->
  <g opacity="0.4">
    <ellipse cx="500" cy="460" rx="450" ry="120" stroke="#1E2F23" stroke-width="1" fill="none"/>
    <ellipse cx="500" cy="460" rx="350" ry="90" stroke="#1E2F23" stroke-width="1" fill="none"/>
    <ellipse cx="500" cy="460" rx="250" ry="60" stroke="#00F58C" stroke-width="1" stroke-dasharray="4 8" fill="none"/>
  </g>

  <!-- Ambient Particles Drifting Upward -->
  <g transform="translate(500, 360)">
    <circle cx="-180" cy="0" r="2.5" fill="#00F58C" class="particle-1"/>
    <circle cx="-60" cy="10" r="3" fill="#38BDF8" class="particle-2"/>
    <circle cx="80" cy="-5" r="2" fill="#00F58C" class="particle-3"/>
    <circle cx="190" cy="5" r="3.5" fill="#00F58C" class="particle-4"/>
  </g>

  <!-- Central Crest / Mic Capsule -->
  <g transform="translate(500, 95)">
    <!-- Radial Backing -->
    <circle cx="0" cy="0" r="42" fill="#111B15" stroke="#1E3326" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="32" fill="#15241C" stroke="#00F58C" stroke-width="2" class="pulse-core"/>
    
    <!-- Stylized Mic Icon -->
    <rect x="-8" y="-14" width="16" height="20" rx="8" fill="#FFFFFF"/>
    <path d="M -13 -2 C -13 10 13 10 13 -2" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="0" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="-7" y1="16" x2="7" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Headlines -->
  <g transform="translate(500, 185)" text-anchor="middle">
    <text y="0" fill="#FFFFFF" font-size="28" font-weight="900" letter-spacing="-0.5" class="font-sans">
      Reclaim Your Voice Typing Speed Today
    </text>
    <text y="28" fill="#9CA3AF" font-size="14.5" font-weight="400" class="font-sans">
      Free, open source, and privacy-respecting. Works system-wide across any Windows application.
    </text>
  </g>

  <!-- Action CTA Buttons Simulated Grid -->
  <g transform="translate(230, 255)">
    <!-- Button 1: Download Release -->
    <g transform="translate(0, 0)" class="btn-shimmer">
      <rect width="240" height="48" rx="24" fill="url(#btn-primary-grad)"/>
      <path d="M 28 24 L 28 30 L 44 30 L 44 24 M 36 16 L 36 26 M 31 22 L 36 27 L 41 22" fill="none" stroke="#06120B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="136" y="29" text-anchor="middle" fill="#06120B" font-size="13" font-weight="800" class="font-sans">
        Download for Windows
      </text>
    </g>

    <!-- Button 2: Star on GitHub -->
    <g transform="translate(260, 0)">
      <rect width="180" height="48" rx="24" fill="#141E18" stroke="#25352A" stroke-width="1.2"/>
      <!-- GitHub Star -->
      <path d="M 32 17 L 34 22 L 39 22 L 35 25 L 36 30 L 32 27 L 28 30 L 29 25 L 25 22 L 30 22 Z" fill="#FBBF24"/>
      <text x="105" y="29" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">
        Star on GitHub
      </text>
    </g>

    <!-- Button 3: Sponsor -->
    <g transform="translate(460, 0)">
      <rect width="180" height="48" rx="24" fill="#141E18" stroke="#25352A" stroke-width="1.2"/>
      <!-- Heart -->
      <path d="M 32 20 C 32 18 30 16 27 16 C 24 16 23 18 23 20 C 23 24 32 29 32 29 C 32 29 41 24 41 20 C 41 18 40 16 37 16 C 34 16 32 18 32 20 Z" fill="#F43F5E"/>
      <text x="105" y="29" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">
        Sponsor Project
      </text>
    </g>
  </g>

  <!-- Bottom Platform Compatibility Ticker -->
  <g transform="translate(500, 360)" text-anchor="middle">
    <rect x="-380" y="-14" width="760" height="28" rx="14" fill="#0F1612" stroke="#1D2A20" stroke-width="1"/>
    <text y="4" fill="#6B7280" font-size="11" font-weight="600" class="font-mono">
      <tspan fill="#00F58C">●</tspan> WINDOWS 10 (22H2+) &amp; WINDOWS 11  •  <tspan fill="#38BDF8">◆</tspan> .NET 4.8  •  <tspan fill="#00F58C">★</tspan> MIT LICENSE  •  <tspan fill="#F59E0B">🔒</tspan> ZERO TELEMETRY
    </text>
  </g>
</svg>
