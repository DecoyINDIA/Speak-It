<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="420" fill="none">
  <defs>
    <radialGradient id="d-glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090C0A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="token-active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16231A"/>
      <stop offset="100%" stop-color="#0F1812"/>
    </linearGradient>

    <filter id="d-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; }
      .font-mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

      /* Animation cycle: 8s */
      .token-strike {
        animation: animStrike 8s ease-in-out infinite;
      }
      .rewind-indicator {
        animation: animRewind 8s ease-in-out infinite;
      }
      .clean-output-pill {
        animation: animCleanResult 8s ease-in-out infinite;
      }
      .pulse-tag {
        animation: tagGlow 2.5s ease-in-out infinite;
      }

      @keyframes animStrike {
        0%, 25% { opacity: 1; stroke-dashoffset: 80; }
        35%, 85% { opacity: 0.9; stroke-dashoffset: 0; }
        95%, 100% { opacity: 0.3; stroke-dashoffset: 80; }
      }
      @keyframes animRewind {
        0%, 25% { opacity: 0; transform: scale(0.8); }
        30%, 80% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 8px #F43F5E); }
        90%, 100% { opacity: 0; transform: scale(0.8); }
      }
      @keyframes animCleanResult {
        0%, 35% { opacity: 0; transform: translateY(10px); }
        45%, 88% { opacity: 1; transform: translateY(0); }
        96%, 100% { opacity: 0; transform: translateY(-5px); }
      }
      @keyframes tagGlow {
        0%, 100% { stroke: #00F58C; }
        50% { stroke: #38BDF8; }
      }

      @media (prefers-reduced-motion: reduce) {
        .token-strike, .rewind-indicator, .clean-output-pill {
          animation: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="800" height="420" rx="16" fill="#090C0A"/>
  <rect width="800" height="420" rx="16" fill="url(#d-glow)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="15.5" stroke="#1D2721" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(36, 32)">
    <rect width="180" height="24" rx="12" fill="#111B15" stroke="#1E3326" stroke-width="1"/>
    <text x="90" y="16" text-anchor="middle" fill="#00F58C" font-size="10.5" font-weight="700" letter-spacing="1.5" class="font-mono">
      FEATURE 02 // COGNITIVE REPAIR
    </text>

    <text x="0" y="54" fill="#FFFFFF" font-size="22" font-weight="800" class="font-sans">
      AI Disfluency Removal &amp; Self-Correction
    </text>
    <text x="0" y="74" fill="#9CA3AF" font-size="13" class="font-sans">
      Speech backtracking, verbal restarts, and filler words are seamlessly resolved into polished written prose.
    </text>
  </g>

  <!-- Spoken Tokens Visual Timeline -->
  <g transform="translate(36, 130)">
    <rect width="728" height="110" rx="10" fill="#101512" stroke="#1B251F" stroke-width="1"/>
    <text x="20" y="24" fill="#6B7280" font-size="10.5" font-weight="700" class="font-mono">LIVE SPEECH TOKEN SEQUENCE</text>

    <!-- Word Tokens Row -->
    <g transform="translate(20, 42)">
      <!-- we will meet on -->
      <g transform="translate(0, 0)">
        <rect width="130" height="38" rx="6" fill="#151E18" stroke="#25352A" stroke-width="1"/>
        <text x="65" y="24" text-anchor="middle" fill="#E5E7EB" font-size="13.5" font-weight="500" class="font-sans">we will meet on</text>
      </g>

      <!-- Monday (Discarded) -->
      <g transform="translate(140, 0)">
        <rect width="90" height="38" rx="6" fill="#201517" stroke="#482229" stroke-width="1"/>
        <text x="45" y="24" text-anchor="middle" fill="#FCA5A5" font-size="13.5" font-weight="600" class="font-sans">Monday</text>
        <!-- Strikethrough line -->
        <line x1="8" y1="19" x2="82" y2="19" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="80" class="token-strike"/>
      </g>

      <!-- no wait (Self-Correction Trigger) -->
      <g transform="translate(240, 0)" class="rewind-indicator">
        <rect width="90" height="38" rx="6" fill="#261318" stroke="#F43F5E" stroke-width="1.5"/>
        <path d="M 16 19 L 24 13 L 24 17 L 30 17 C 33 17 35 19 35 22 L 35 24 L 32 24 L 32 22 C 32 20 31 19 29 19 L 24 19 L 24 23 Z" fill="#F43F5E"/>
        <text x="56" y="24" text-anchor="middle" fill="#F43F5E" font-size="12" font-weight="700" class="font-mono">no wait</text>
      </g>

      <!-- Tuesday morning at 10 (Target) -->
      <g transform="translate(340, 0)">
        <rect width="190" height="38" rx="6" fill="#13241A" stroke="#00F58C" stroke-width="1.5" class="pulse-tag"/>
        <text x="95" y="24" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700" class="font-sans">Tuesday morning at 10</text>
      </g>

      <!-- Badge: Backtrack resolved -->
      <g transform="translate(540, 6)">
        <rect width="145" height="26" rx="13" fill="#111B15" stroke="#1E3527" stroke-width="1"/>
        <text x="72" y="17" text-anchor="middle" fill="#00F58C" font-size="10.5" font-weight="700" class="font-mono">
          ↺ ROLLBACK APPLIED
        </text>
      </g>
    </g>
  </g>

  <!-- Output Result Card -->
  <g transform="translate(36, 260)" class="clean-output-pill">
    <rect width="728" height="120" rx="10" fill="#0E1912" stroke="#00F58C" stroke-width="1.5" filter="url(#d-filter)"/>
    
    <g transform="translate(24, 20)">
      <circle cx="9" cy="9" r="9" fill="#00F58C"/>
      <path d="M 6 9 L 8 11 L 12 7" fill="none" stroke="#070E0A" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="14" fill="#00F58C" font-size="12" font-weight="700" class="font-mono">FINAL RESTORED DICTATION INSERTION</text>
      
      <!-- Pristine Output Sentence -->
      <text x="0" y="50" fill="#FFFFFF" font-size="18" font-weight="700" class="font-sans">
        "We will meet on Tuesday morning at 10."
      </text>

      <!-- Explanatory Pills -->
      <g transform="translate(0, 72)">
        <rect width="180" height="22" rx="4" fill="#16261C"/>
        <text x="10" y="15" fill="#9CA3AF" font-size="11" class="font-mono">✓ Eliminated filler words</text>

        <rect x="195" width="220" height="22" rx="4" fill="#16261C"/>
        <text x="205" y="15" fill="#9CA3AF" font-size="11" class="font-mono">✓ Capitalized sentence boundary</text>

        <rect x="430" width="235" height="22" rx="4" fill="#16261C"/>
        <text x="440" y="15" fill="#9CA3AF" font-size="11" class="font-mono">✓ Punctuation &amp; numeral normalized</text>
      </g>
    </g>
  </g>
</svg>
