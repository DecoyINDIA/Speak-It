<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="420" fill="none">
  <defs>
    <radialGradient id="h-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090C0A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F58C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <filter id="h-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; }
      .font-mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

      .scanner-beam {
        animation: scanMove 4s ease-in-out infinite;
      }
      .spec-bar-1 { animation: specPulse 0.8s infinite alternate ease-in-out; }
      .spec-bar-2 { animation: specPulse 1.2s infinite alternate ease-in-out; }
      .spec-bar-3 { animation: specPulse 0.9s infinite alternate ease-in-out; }
      .spec-bar-4 { animation: specPulse 1.4s infinite alternate ease-in-out; }
      .spec-bar-5 { animation: specPulse 0.7s infinite alternate ease-in-out; }
      .confidence-counter {
        animation: scoreGlow 3s ease-in-out infinite;
      }

      @keyframes scanMove {
        0%, 100% { transform: translateY(0); opacity: 0.2; }
        50% { transform: translateY(180px); opacity: 0.8; }
      }
      @keyframes scoreGlow {
        0%, 100% { filter: drop-shadow(0 0 2px #00F58C); }
        50% { filter: drop-shadow(0 0 10px #00F58C); }
      }
      @keyframes specPulse {
        0% { transform: scaleY(0.4); }
        100% { transform: scaleY(1.4); }
      }

      @media (prefers-reduced-motion: reduce) {
        .scanner-beam, .spec-bar-1, .spec-bar-2, .spec-bar-3, .spec-bar-4, .spec-bar-5 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="420" rx="16" fill="#090C0A"/>
  <rect width="800" height="420" rx="16" fill="url(#h-glow)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="15.5" stroke="#1D2721" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(36, 32)">
    <rect width="180" height="24" rx="12" fill="#111B15" stroke="#1E3326" stroke-width="1"/>
    <text x="90" y="16" text-anchor="middle" fill="#00F58C" font-size="10.5" font-weight="700" letter-spacing="1.5" class="font-mono">
      FEATURE 01 // ACCENT ENGINE
    </text>

    <text x="0" y="54" fill="#FFFFFF" font-size="22" font-weight="800" class="font-sans">
      Hinglish &amp; Indian Accent Mastery
    </text>
    <text x="0" y="74" fill="#9CA3AF" font-size="13" class="font-sans">
      Code-switching speech recognition that understands mixed Hindi-English phrasing without phonetic butchering.
    </text>
  </g>

  <!-- Left: Acoustic Analyzer & Spectrum Visualizer -->
  <g transform="translate(36, 130)">
    <rect width="210" height="250" rx="10" fill="#101512" stroke="#1B251F" stroke-width="1"/>
    
    <text x="16" y="24" fill="#6B7280" font-size="10.5" font-weight="700" class="font-mono">ACOUSTIC SPECTRUM</text>
    <text x="16" y="40" fill="#00F58C" font-size="12" font-weight="600" class="font-sans">Hindi + English Mixed</text>

    <!-- Spectrum Bars -->
    <g transform="translate(16, 120)" fill="#00F58C" opacity="0.85">
      <rect x="0" y="-30" width="8" height="60" rx="3" class="spec-bar-1"/>
      <rect x="14" y="-45" width="8" height="90" rx="3" class="spec-bar-2"/>
      <rect x="28" y="-20" width="8" height="40" rx="3" class="spec-bar-3"/>
      <rect x="42" y="-55" width="8" height="110" rx="3" class="spec-bar-4"/>
      <rect x="56" y="-35" width="8" height="70" rx="3" class="spec-bar-1"/>
      <rect x="70" y="-50" width="8" height="100" rx="3" class="spec-bar-5"/>
      <rect x="84" y="-25" width="8" height="50" rx="3" class="spec-bar-2"/>
      <rect x="98" y="-40" width="8" height="80" rx="3" class="spec-bar-3"/>
      <rect x="112" y="-60" width="8" height="120" rx="3" class="spec-bar-4"/>
      <rect x="126" y="-30" width="8" height="60" rx="3" class="spec-bar-5"/>
      <rect x="140" y="-45" width="8" height="90" rx="3" class="spec-bar-1"/>
      <rect x="154" y="-20" width="8" height="40" rx="3" class="spec-bar-2"/>
      <rect x="168" y="-35" width="8" height="70" rx="3" class="spec-bar-3"/>
    </g>

    <path d="M 16 195 L 194 195" stroke="#1D2921" stroke-width="1"/>

    <!-- Accuracy Metric -->
    <g transform="translate(16, 212)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" class="font-mono">PHONETIC ACCURACY</text>
      <text x="0" y="24" fill="#00F58C" font-size="22" font-weight="900" class="font-mono confidence-counter">99.4%</text>
      <text x="80" y="22" fill="#38BDF8" font-size="11" font-weight="600" class="font-sans">ZERO LOSS</text>
    </g>
  </g>

  <!-- Right: Direct Real-World Benchmark Comparison -->
  <g transform="translate(266, 130)">
    <!-- Spoken Prompt Reference -->
    <rect width="498" height="50" rx="8" fill="#131B16" stroke="#213025" stroke-width="1"/>
    <text x="16" y="20" fill="#6B7280" font-size="10.5" font-weight="700" class="font-mono">RAW SPOKEN AUDIO (INDIAN ACCENT):</text>
    <text x="16" y="38" fill="#F3F4F6" font-size="13" font-style="italic" class="font-sans">
      "Arre Sunita deliverable ready hai, hum Tuesday meeting mein finalize kar lenge."
    </text>

    <!-- Failed Win+H Result -->
    <g transform="translate(0, 64)">
      <rect width="498" height="84" rx="8" fill="#161214" stroke="#381D22" stroke-width="1"/>
      <g transform="translate(16, 16)">
        <circle cx="8" cy="8" r="8" fill="#F43F5E" fill-opacity="0.2"/>
        <text x="8" y="12" text-anchor="middle" fill="#F43F5E" font-size="11" font-weight="800" class="font-sans">✕</text>
        <text x="24" y="12" fill="#F43F5E" font-size="11.5" font-weight="700" class="font-mono">WINDOWS VOICE TYPING (WIN + H) — PHONETIC BUTCHERING</text>
      </g>
      <text x="40" y="52" fill="#9CA3AF" font-size="13" class="font-mono" text-decoration="line-through">
        "are Sunita deliver able ready hi home Tuesday meeting main finalize kar language"
      </text>
      <text x="40" y="70" fill="#EF4444" font-size="11" class="font-mono">
        ⚠ Failed: 'deliverable' broken, 'hai' -> 'hi', 'hum' -> 'home', 'lenge' -> 'language'
      </text>
    </g>

    <!-- SpeakIt Flawless Result -->
    <g transform="translate(0, 160)">
      <rect width="498" height="90" rx="8" fill="#101C15" stroke="#00F58C" stroke-width="1.5" filter="url(#h-filter)"/>
      <g transform="translate(16, 18)">
        <circle cx="8" cy="8" r="8" fill="#00F58C"/>
        <path d="M 5 8 L 7 10 L 11 6" fill="none" stroke="#0A110D" stroke-width="1.8" stroke-linecap="round"/>
        <text x="24" y="12" fill="#00F58C" font-size="11.5" font-weight="700" class="font-mono">SPEAKIT ENGINE (GROQ LPU + LLM REASONING)</text>
      </g>
      <text x="40" y="55" fill="#FFFFFF" font-size="14" font-weight="600" class="font-sans">
        "Sunita, deliverable ready hai; hum Tuesday meeting mein finalize kar lenge."
      </text>
      <text x="40" y="74" fill="#00F58C" font-size="11.5" font-weight="600" class="font-mono">
        ✓ Disfluency pruned • Proper nouns retained • Natural Hinglish preserved
      </text>
    </g>
  </g>
</svg>
