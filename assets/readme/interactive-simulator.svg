<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="460" fill="none">
  <defs>
    <radialGradient id="sim-glow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080A09" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="winner-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F58C"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F58C"/>
    </linearGradient>

    <filter id="sim-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; }
      .font-mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

      .crown-pulse {
        animation: crownFloat 2.4s ease-in-out infinite alternate;
      }
      .tab-active-glow {
        animation: tabPulse 3s ease-in-out infinite;
      }
      .meter-fill-anim {
        animation: meterWiggle 3s ease-in-out infinite alternate;
      }

      @keyframes crownFloat {
        0% { transform: translateY(0); filter: drop-shadow(0 0 3px #00F58C); }
        100% { transform: translateY(-4px); filter: drop-shadow(0 0 10px #00F58C); }
      }
      @keyframes tabPulse {
        0%, 100% { border-color: #00F58C; }
        50% { border-color: #38BDF8; }
      }
      @keyframes meterWiggle {
        0% { width: 220px; }
        100% { width: 236px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .crown-pulse, .tab-active-glow, .meter-fill-anim {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Panel -->
  <rect width="920" height="460" rx="16" fill="#080A09"/>
  <rect width="920" height="460" rx="16" fill="url(#sim-glow)"/>
  <rect x="0.5" y="0.5" width="919" height="459" rx="15.5" stroke="#1D2721" stroke-width="1"/>

  <!-- Top Simulator Chrome -->
  <g transform="translate(36, 30)">
    <rect width="230" height="24" rx="12" fill="#111B15" stroke="#1E3326" stroke-width="1"/>
    <text x="115" y="16" text-anchor="middle" fill="#00F58C" font-size="10.5" font-weight="700" letter-spacing="1.5" class="font-mono">
      BENCHMARK PLAYGROUND // MATRIX
    </text>

    <!-- Simulated Interactive Tab Bar -->
    <g transform="translate(320, 0)">
      <!-- Tab 1: Selected -->
      <rect width="160" height="26" rx="6" fill="#15241C" stroke="#00F58C" stroke-width="1.2" class="tab-active-glow"/>
      <text x="80" y="17" text-anchor="middle" fill="#00F58C" font-size="11" font-weight="700" class="font-mono">
        ◉ HINGLISH UTTERANCE
      </text>

      <!-- Tab 2: Secondary -->
      <g transform="translate(170, 0)">
        <rect width="180" height="26" rx="6" fill="#101512" stroke="#1D2721" stroke-width="1"/>
        <text x="90" y="17" text-anchor="middle" fill="#9CA3AF" font-size="11" class="font-mono">
          ○ BACKTRACK RECOVERY
        </text>
      </g>

      <!-- Tab 3: Secondary -->
      <g transform="translate(360, 0)">
        <rect width="170" height="26" rx="6" fill="#101512" stroke="#1D2721" stroke-width="1"/>
        <text x="85" y="17" text-anchor="middle" fill="#9CA3AF" font-size="11" class="font-mono">
          ○ CODE IDENTIFIERS
        </text>
      </g>
    </g>
  </g>

  <!-- 3-Column Comparative Evaluation Matrix -->
  <g transform="translate(36, 80)">
    
    <!-- COLUMN 1: WINDOWS VOICE TYPING (WIN+H) -->
    <g transform="translate(0, 0)">
      <rect width="265" height="340" rx="10" fill="#0E1210" stroke="#1C2420" stroke-width="1"/>
      
      <!-- Col Header -->
      <g transform="translate(20, 20)">
        <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700" class="font-mono">MICROSOFT</text>
        <text x="0" y="20" fill="#FFFFFF" font-size="15" font-weight="700" class="font-sans">Windows (Win+H)</text>
        <text x="0" y="38" fill="#6B7280" font-size="11" class="font-mono">Built-in Windows STT</text>
      </g>

      <line x1="20" y1="75" x2="245" y2="75" stroke="#19221C" stroke-width="1"/>

      <!-- Attributes -->
      <g transform="translate(20, 95)" font-size="11.5" class="font-sans">
        <text y="0" fill="#9CA3AF">Price: <tspan fill="#E5E7EB" font-weight="600">Free (Included)</tspan></text>
        <text y="28" fill="#9CA3AF">Hinglish: <tspan fill="#F43F5E" font-weight="600">✕ Poor / Butchered</tspan></text>
        <text y="56" fill="#9CA3AF">Disfluencies: <tspan fill="#F43F5E" font-weight="600">✕ Verbatim (um, ah)</tspan></text>
        <text y="84" fill="#9CA3AF">Backtracking: <tspan fill="#F43F5E" font-weight="600">✕ No self-correction</tspan></text>
        <text y="112" fill="#9CA3AF">Password Shield: <tspan fill="#F43F5E" font-weight="600">✕ None</tspan></text>
        <text y="140" fill="#9CA3AF">Latency: <tspan fill="#E5E7EB" font-family="'Cascadia Code', monospace">~1,200 ms</tspan></text>
      </g>

      <!-- Score Bar -->
      <g transform="translate(20, 275)">
        <text x="0" y="0" fill="#6B7280" font-size="10" font-weight="700" class="font-mono">COMPOSITE ACCURACY</text>
        <rect x="0" y="8" width="225" height="8" rx="4" fill="#1C2420"/>
        <rect x="0" y="8" width="72" height="8" rx="4" fill="#F43F5E"/>
        <text x="0" y="34" fill="#F43F5E" font-size="16" font-weight="800" class="font-mono">32 / 100</text>
      </g>
    </g>

    <!-- COLUMN 2: WISPR FLOW (COMMERCIAL SAAS) -->
    <g transform="translate(285, 0)">
      <rect width="265" height="340" rx="10" fill="#0E1210" stroke="#1C2420" stroke-width="1"/>
      
      <!-- Col Header -->
      <g transform="translate(20, 20)">
        <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700" class="font-mono">COMMERCIAL SAAS</text>
        <text x="0" y="20" fill="#FFFFFF" font-size="15" font-weight="700" class="font-sans">Wispr Flow</text>
        <text x="0" y="38" fill="#38BDF8" font-size="11" class="font-mono">$12–$15 / month</text>
      </g>

      <line x1="20" y1="75" x2="245" y2="75" stroke="#19221C" stroke-width="1"/>

      <!-- Attributes -->
      <g transform="translate(20, 95)" font-size="11.5" class="font-sans">
        <text y="0" fill="#9CA3AF">Annual Cost: <tspan fill="#F59E0B" font-weight="600">$144–$180 / yr</tspan></text>
        <text y="28" fill="#9CA3AF">Hinglish: <tspan fill="#38BDF8" font-weight="600">✓ Good (Cloud only)</tspan></text>
        <text y="56" fill="#9CA3AF">Disfluencies: <tspan fill="#38BDF8" font-weight="600">✓ LLM Cleaned</tspan></text>
        <text y="84" fill="#9CA3AF">Backtracking: <tspan fill="#38BDF8" font-weight="600">✓ Handled</tspan></text>
        <text y="112" fill="#9CA3AF">100% Offline: <tspan fill="#F43F5E" font-weight="600">✕ Cloud Required</tspan></text>
        <text y="140" fill="#9CA3AF">Latency: <tspan fill="#E5E7EB" font-family="'Cascadia Code', monospace">~900 ms</tspan></text>
      </g>

      <!-- Score Bar -->
      <g transform="translate(20, 275)">
        <text x="0" y="0" fill="#6B7280" font-size="10" font-weight="700" class="font-mono">COMPOSITE ACCURACY</text>
        <rect x="0" y="8" width="225" height="8" rx="4" fill="#1C2420"/>
        <rect x="0" y="8" width="175" height="8" rx="4" fill="#38BDF8"/>
        <text x="0" y="34" fill="#38BDF8" font-size="16" font-weight="800" class="font-mono">78 / 100</text>
      </g>
    </g>

    <!-- COLUMN 3: SPEAKIT (WINNER - VOLT HIGHLIGHT) -->
    <g transform="translate(570, 0)">
      <rect width="278" height="340" rx="10" fill="#101914" stroke="url(#winner-border)" stroke-width="2" filter="url(#sim-filter)"/>
      
      <!-- Winner Badge -->
      <g transform="translate(145, 12)" class="crown-pulse">
        <rect width="115" height="22" rx="11" fill="#00F58C"/>
        <text x="57.5" y="15" text-anchor="middle" fill="#080C0A" font-size="10" font-weight="800" class="font-mono">
          ★ SOVEREIGN
        </text>
      </g>

      <!-- Col Header -->
      <g transform="translate(20, 20)">
        <text x="0" y="0" fill="#00F58C" font-size="11" font-weight="800" class="font-mono">OPEN SOURCE (MIT)</text>
        <text x="0" y="20" fill="#FFFFFF" font-size="18" font-weight="900" class="font-sans">SpeakIt Engine</text>
        <text x="0" y="38" fill="#00F58C" font-size="11" font-weight="700" class="font-mono">$0 / Free &amp; Air-Gapped</text>
      </g>

      <line x1="20" y1="75" x2="258" y2="75" stroke="#1E3024" stroke-width="1"/>

      <!-- Attributes -->
      <g transform="translate(20, 95)" font-size="11.5" class="font-sans">
        <text y="0" fill="#FFFFFF">Annual Cost: <tspan fill="#00F58C" font-weight="800">$0 Forever</tspan></text>
        <text y="28" fill="#FFFFFF">Hinglish: <tspan fill="#00F58C" font-weight="800">✓ Accent Optimized</tspan></text>
        <text y="56" fill="#FFFFFF">Disfluencies: <tspan fill="#00F58C" font-weight="800">✓ AI Self-Correction</tspan></text>
        <text y="84" fill="#FFFFFF">Password Shield: <tspan fill="#00F58C" font-weight="800">✓ UI Automation</tspan></text>
        <text y="112" fill="#FFFFFF">100% Offline: <tspan fill="#00F58C" font-weight="800">✓ whisper.cpp Core</tspan></text>
        <text y="140" fill="#FFFFFF">Latency: <tspan fill="#00F58C" font-family="'Cascadia Code', monospace" font-weight="800">~480–650 ms p50</tspan></text>
      </g>

      <!-- Score Bar -->
      <g transform="translate(20, 275)">
        <text x="0" y="0" fill="#00F58C" font-size="10" font-weight="700" class="font-mono">COMPOSITE ACCURACY</text>
        <rect x="0" y="8" width="238" height="8" rx="4" fill="#1C2420"/>
        <rect class="meter-fill-anim" x="0" y="8" width="230" height="8" rx="4" fill="#00F58C"/>
        <text x="0" y="34" fill="#00F58C" font-size="18" font-weight="900" class="font-mono">98.4 / 100</text>
        <text x="110" y="34" fill="#FFFFFF" font-size="11" font-weight="700" class="font-sans">TOP PERFORMER</text>
      </g>
    </g>
  </g>
</svg>
