<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="600" fill="none">
  <defs>
    <radialGradient id="arch-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#0B130E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070908" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pipe-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F58C"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="arch-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; }
      .font-mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

      .flow-packet-1 {
        stroke-dasharray: 8 16;
        animation: flowDash 2.5s linear infinite;
      }
      .flow-packet-2 {
        stroke-dasharray: 8 16;
        animation: flowDash 3.5s linear infinite;
      }
      .flow-packet-rev {
        stroke-dasharray: 8 16;
        animation: flowDashRev 3s linear infinite;
      }
      .state-node-pulse {
        animation: stateCycle 6s ease-in-out infinite;
      }

      @keyframes flowDash {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flowDashRev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 48; }
      }
      @keyframes stateCycle {
        0%, 100% { filter: drop-shadow(0 0 2px #00F58C); }
        50% { filter: drop-shadow(0 0 10px #00F58C); }
      }

      @media (prefers-reduced-motion: reduce) {
        .flow-packet-1, .flow-packet-2, .flow-packet-rev, .state-node-pulse {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="600" rx="16" fill="#080A09"/>
  <rect width="1000" height="600" rx="16" fill="url(#arch-glow)"/>
  <rect x="0.5" y="0.5" width="999" height="599" rx="15.5" stroke="#1C2720" stroke-width="1"/>

  <!-- Top Title -->
  <g transform="translate(40, 36)">
    <rect width="210" height="24" rx="12" fill="#111B15" stroke="#1E3326" stroke-width="1"/>
    <text x="105" y="16" text-anchor="middle" fill="#00F58C" font-size="10.5" font-weight="700" letter-spacing="1.5" class="font-mono">
      SYSTEM ARCHITECTURE // v2.0
    </text>
    <text x="0" y="56" fill="#FFFFFF" font-size="22" font-weight="800" class="font-sans">
      End-to-End Low-Latency Pipeline
    </text>
  </g>

  <!-- LAYER 1: NATIVE WINDOWS OS LAYER (LEFT) -->
  <g transform="translate(40, 110)">
    <rect width="260" height="440" rx="10" fill="#0E1411" stroke="#1F2E24" stroke-width="1"/>
    
    <!-- Title -->
    <g transform="translate(16, 20)">
      <circle cx="6" cy="6" r="4" fill="#00F58C"/>
      <text x="18" y="10" fill="#00F58C" font-size="12" font-weight="700" class="font-mono">NATIVE HELPER (.NET 4.8 / C#)</text>
      <text x="0" y="30" fill="#9CA3AF" font-size="11" class="font-sans">Win32 Hook &amp; Injection Engine</text>
    </g>

    <!-- Component 1: WH_KEYBOARD_LL -->
    <g transform="translate(16, 75)">
      <rect width="228" height="64" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">WH_KEYBOARD_LL Hook</text>
      <text x="12" y="38" fill="#9CA3AF" font-size="10.5" class="font-sans">Zero-lag global hotkey capture</text>
      <text x="12" y="52" fill="#00F58C" font-size="10" class="font-mono">Ctrl + Win [Hold / Double-tap]</text>
    </g>

    <!-- Component 2: UI Automation -->
    <g transform="translate(16, 155)">
      <rect width="228" height="64" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">UI Automation Shield</text>
      <text x="12" y="38" fill="#9CA3AF" font-size="10.5" class="font-sans">Inspects focused control in real-time</text>
      <text x="12" y="52" fill="#F43F5E" font-size="10" class="font-mono">IsPassword == true → Abort Mic</text>
    </g>

    <!-- Component 3: Delayed Rendering Paste -->
    <g transform="translate(16, 235)">
      <rect width="228" height="74" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">Delayed Clipboard Paste</text>
      <text x="12" y="38" fill="#9CA3AF" font-size="10.5" class="font-sans">WM_RENDERFORMAT streaming</text>
      <text x="12" y="52" fill="#9CA3AF" font-size="10.5" class="font-sans">Preserves prior clipboard content</text>
      <text x="12" y="66" fill="#00F58C" font-size="10" class="font-mono">p50 paste latency: ~15 ms</text>
    </g>

    <!-- Component 4: Process Watchdog -->
    <g transform="translate(16, 325)">
      <rect width="228" height="54" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">Named Pipe Server</text>
      <text x="12" y="40" fill="#9CA3AF" font-size="10.5" class="font-sans">High-speed duplex stdio protocol</text>
    </g>
  </g>

  <!-- INTERCONNECT ARROWS: Helper -> Main -->
  <g transform="translate(300, 260)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#00F58C" stroke-width="2.5" class="flow-packet-1"/>
    <polygon points="56,-4 64,0 56,4" fill="#00F58C"/>
    <text x="30" y="-8" text-anchor="middle" fill="#00F58C" font-size="9" font-weight="700" class="font-mono">JSON IPC</text>
  </g>
  <g transform="translate(300, 370)">
    <line x1="60" y1="0" x2="0" y2="0" stroke="#38BDF8" stroke-width="2.5" class="flow-packet-rev"/>
    <polygon points="4,-4 -4,0 4,4" fill="#38BDF8"/>
    <text x="30" y="-8" text-anchor="middle" fill="#38BDF8" font-size="9" font-weight="700" class="font-mono">PASTE CMD</text>
  </g>

  <!-- LAYER 2: ELECTRON MAIN PROCESS (CENTER) -->
  <g transform="translate(360, 110)">
    <rect width="280" height="440" rx="10" fill="#0E1411" stroke="#00F58C" stroke-width="1.2" filter="url(#arch-filter)"/>
    
    <!-- Title -->
    <g transform="translate(16, 20)">
      <circle cx="6" cy="6" r="4" fill="#00F58C"/>
      <text x="18" y="10" fill="#00F58C" font-size="12" font-weight="700" class="font-mono">ELECTRON MAIN (NODE/TS)</text>
      <text x="0" y="30" fill="#9CA3AF" font-size="11" class="font-sans">Core State Machine &amp; Dispatcher</text>
    </g>

    <!-- State Machine Card -->
    <g transform="translate(16, 75)">
      <rect width="248" height="90" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="20" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">Dictation Finite State Machine</text>
      
      <!-- State Chips -->
      <g transform="translate(12, 34)">
        <rect width="46" height="20" rx="4" fill="#1A281E" stroke="#253B2B" stroke-width="1"/>
        <text x="23" y="14" text-anchor="middle" fill="#9CA3AF" font-size="9" class="font-mono">IDLE</text>

        <text x="52" y="14" fill="#00F58C" font-size="10">→</text>

        <rect x="62" width="56" height="20" rx="4" fill="#16291C" stroke="#00F58C" stroke-width="1" class="state-node-pulse"/>
        <text x="90" y="14" text-anchor="middle" fill="#00F58C" font-size="9" font-weight="700" class="font-mono">RECORD</text>

        <text x="124" y="14" fill="#00F58C" font-size="10">→</text>

        <rect x="134" width="50" height="20" rx="4" fill="#16242B" stroke="#38BDF8" stroke-width="1"/>
        <text x="159" y="14" text-anchor="middle" fill="#38BDF8" font-size="9" class="font-mono">PROC</text>

        <text x="190" y="14" fill="#00F58C" font-size="10">→</text>

        <rect x="198" width="40" height="20" rx="4" fill="#1A281E" stroke="#253B2B" stroke-width="1"/>
        <text x="218" y="14" text-anchor="middle" fill="#9CA3AF" font-size="9" class="font-mono">PASTE</text>
      </g>
      <text x="12" y="74" fill="#6B7280" font-size="10" class="font-mono">Handles audio lock &amp; safe recovery</text>
    </g>

    <!-- Insert Queue & Smart Formatter -->
    <g transform="translate(16, 180)">
      <rect width="248" height="74" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">Smart Formatter &amp; Dictionary</text>
      <text x="12" y="38" fill="#9CA3AF" font-size="10.5" class="font-sans">Soundex phonetic mapping engine</text>
      <text x="12" y="52" fill="#9CA3AF" font-size="10.5" class="font-sans">Context-aware numeral/list formats</text>
      <text x="12" y="66" fill="#00F58C" font-size="10" class="font-mono">Custom sounds-like glossary</text>
    </g>

    <!-- Storage Vault -->
    <g transform="translate(16, 270)">
      <rect width="248" height="64" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">DPAPI Cryptographic Vault</text>
      <text x="12" y="38" fill="#9CA3AF" font-size="10.5" class="font-sans">Windows safeStorage key encryption</text>
      <text x="12" y="52" fill="#38BDF8" font-size="10" class="font-mono">better-sqlite3 local database</text>
    </g>

    <!-- IPC Window Bridge -->
    <g transform="translate(16, 350)">
      <rect width="248" height="64" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">Renderer Bridge (Preload)</text>
      <text x="12" y="38" fill="#9CA3AF" font-size="10.5" class="font-sans">Context-isolated secure IPC</text>
      <text x="12" y="52" fill="#00F58C" font-size="10" class="font-mono">Floating Pill + Hub React Windows</text>
    </g>
  </g>

  <!-- INTERCONNECT ARROWS: Main -> Providers -->
  <g transform="translate(640, 240)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#00F58C" stroke-width="2.5" class="flow-packet-2"/>
    <polygon points="56,-4 64,0 56,4" fill="#00F58C"/>
    <text x="30" y="-8" text-anchor="middle" fill="#00F58C" font-size="9" font-weight="700" class="font-mono">OPUS WEBM</text>
  </g>
  <g transform="translate(640, 350)">
    <line x1="60" y1="0" x2="0" y2="0" stroke="#00F58C" stroke-width="2.5" class="flow-packet-rev"/>
    <polygon points="4,-4 -4,0 4,4" fill="#00F58C"/>
    <text x="30" y="-8" text-anchor="middle" fill="#00F58C" font-size="9" font-weight="700" class="font-mono">CLEAN TEXT</text>
  </g>

  <!-- LAYER 3: DUAL-ENGINE PROVIDER MATRIX (RIGHT) -->
  <g transform="translate(700, 110)">
    <rect width="260" height="440" rx="10" fill="#0E1411" stroke="#1F2E24" stroke-width="1"/>
    
    <!-- Title -->
    <g transform="translate(16, 20)">
      <circle cx="6" cy="6" r="4" fill="#38BDF8"/>
      <text x="18" y="10" fill="#38BDF8" font-size="12" font-weight="700" class="font-mono">AI PROVIDER CHAIN</text>
      <text x="0" y="30" fill="#9CA3AF" font-size="11" class="font-sans">Sub-Second Streaming Engines</text>
    </g>

    <!-- Provider 1: Groq LPU -->
    <g transform="translate(16, 75)">
      <rect width="228" height="84" rx="6" fill="#141E18" stroke="#00F58C" stroke-width="1.2"/>
      <text x="12" y="20" fill="#00F58C" font-size="11" font-weight="800" class="font-mono">PRIMARY: GROQ LPU</text>
      <text x="12" y="36" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Whisper Large-v3-Turbo</text>
      <text x="12" y="52" fill="#9CA3AF" font-size="10.5" class="font-sans">STT p50: ~480 ms</text>
      <text x="12" y="68" fill="#38BDF8" font-size="10.5" class="font-sans">LLM: Llama-3.3-70b-versatile (~210 ms)</text>
    </g>

    <!-- Provider 2: Gemini -->
    <g transform="translate(16, 175)">
      <rect width="228" height="64" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="20" fill="#9CA3AF" font-size="11" font-weight="700" class="font-mono">FALLBACK: GOOGLE GEMINI</text>
      <text x="12" y="36" fill="#FFFFFF" font-size="12" font-weight="600" class="font-sans">Gemini 2.5 Flash</text>
      <text x="12" y="52" fill="#9CA3AF" font-size="10.5" class="font-sans">Multimodal STT + Disfluency clean</text>
    </g>

    <!-- Provider 3: whisper.cpp Offline -->
    <g transform="translate(16, 255)">
      <rect width="228" height="84" rx="6" fill="#141E18" stroke="#00F58C" stroke-width="1.2"/>
      <text x="12" y="20" fill="#00F58C" font-size="11" font-weight="800" class="font-mono">OFFLINE: WHISPER.CPP</text>
      <text x="12" y="36" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Local C++ CPU Inference</text>
      <text x="12" y="52" fill="#9CA3AF" font-size="10.5" class="font-sans">ggml-small.bin (0.9s - 1.8s p50)</text>
      <text x="12" y="68" fill="#00F58C" font-size="10" class="font-mono">Zero network • 100% Air-Gapped</text>
    </g>

    <!-- Provider 4: Local Ollama LLM -->
    <g transform="translate(16, 355)">
      <rect width="228" height="54" rx="6" fill="#141E18" stroke="#25352A" stroke-width="1"/>
      <text x="12" y="20" fill="#9CA3AF" font-size="11" font-weight="700" class="font-mono">LOCAL LLM CLEANUP</text>
      <text x="12" y="38" fill="#9CA3AF" font-size="10.5" class="font-sans">Ollama / LM Studio (llama3.2)</text>
    </g>
  </g>
</svg>
