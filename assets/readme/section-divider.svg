<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" height="40" fill="none">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F58C" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00F58C" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#00F58C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F58C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F58C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F58C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-div" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pulse-beam {
        animation: beamMove 4s ease-in-out infinite;
      }
      .node-pulse {
        animation: nodeGlow 2.5s ease-in-out infinite;
      }
      @keyframes beamMove {
        0% { transform: translateX(-400px); opacity: 0; }
        25% { opacity: 1; }
        75% { opacity: 1; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 3; fill: #00F58C; filter: drop-shadow(0 0 2px #00F58C); }
        50% { r: 4.5; fill: #FFFFFF; filter: drop-shadow(0 0 8px #00F58C); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-beam { display: none; }
        .node-pulse { animation: none; r: 3.5; }
      }
    </style>
  </defs>

  <!-- Baseline track -->
  <line x1="100" y1="20" x2="1100" y2="20" stroke="#1F2622" stroke-width="1"/>
  <line x1="250" y1="20" x2="950" y2="20" stroke="url(#divider-grad)" stroke-width="1.5"/>

  <!-- Animated beam -->
  <g class="pulse-beam">
    <line x1="0" y1="20" x2="200" y2="20" stroke="url(#beam-grad)" stroke-width="2.5" filter="url(#glow-div)"/>
  </g>

  <!-- Center Diamond & Nodes -->
  <g transform="translate(600, 20)">
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#0E1210" stroke="#00F58C" stroke-width="1.5" filter="url(#glow-div)"/>
    <circle cx="0" cy="0" r="2" fill="#00F58C"/>
  </g>
  <circle cx="560" cy="20" r="2" fill="#00F58C" opacity="0.6"/>
  <circle cx="640" cy="20" r="2" fill="#00F58C" opacity="0.6"/>
</svg>
